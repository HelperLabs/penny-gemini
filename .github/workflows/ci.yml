name: Verify extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
      - run: npm install -g npm@11.18.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: git diff --exit-code -- scripts/gemini_hook.mjs
      - name: Install pinned official verifier runtime
        run: npm install --prefix "$RUNNER_TEMP/penny-gemini-host" --ignore-scripts --no-save --no-audit --no-fund @google/gemini-cli@0.63.0 @google/gemini-cli-core@0.63.0
      - name: Verify native loader and hooks without network
        run: node scripts/verify-host.mjs "$RUNNER_TEMP/penny-gemini-host" .
      - name: Record reproducible release inputs
        run: |
          mkdir -p .live
          node scripts/dependency-manifest.mjs release-dependencies.json
          node scripts/dependency-manifest.mjs .live/dependencies-repeat.json
          cmp release-dependencies.json .live/dependencies-repeat.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dependencies-${{ github.sha }}
          path: release-dependencies.json
          retention-days: 90
          if-no-files-found: error
